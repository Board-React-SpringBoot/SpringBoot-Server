spring:
  application:
    name: board-server
  profiles:
    active: dev
    group:
      dev: common, secret

---

# application-common.yml
spring:
  config:
    activate:
      on-profile: common
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - nickname
              - profile
          google:
            client-name: google
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response